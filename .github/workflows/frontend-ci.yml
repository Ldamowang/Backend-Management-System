name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'admin-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'admin-frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: admin-frontend

jobs:
  ci:
    name: Lint → Type Check → Test → Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high || echo "::warning::Dependency audit found issues. Run 'npm audit' locally for details."

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npm run test -- --reporter=default

      - name: Test with coverage
        if: matrix.node-version == 20
        run: npm run test:coverage || echo "::warning::Coverage report requires @vitest/coverage-v8. Install it via: npm i -D @vitest/coverage-v8"

      - name: Upload coverage report
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: admin-frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: matrix.node-version == 20
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: admin-frontend/dist/
          retention-days: 7
