spring:
  datasource:
    url: jdbc:mysql://localhost:3306/admin_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:redis_secure_password}

jwt:
  secret: ${JWT_SECRET:my-admin-jwt-secret-key-for-dev-only-2026}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# 开发环境专用: 启用 SQL 日志和 Swagger
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.iflytek.admin: debug
