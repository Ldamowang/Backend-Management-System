spring:
  datasource:
    url: jdbc:h2:mem:admin_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:h2/schema.sql
      data-locations: classpath:h2/data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:test-only-secret-key-must-be-at-least-32-bytes-long-for-hmac-sha256}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

cors:
  allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.iflytek.admin: debug
